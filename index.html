<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Локатор Газявы</title>

<!-- Чтобы на айфоне «На экран Домой» выглядело как настоящее приложение -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Газява">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<!-- Leaflet — библиотека для карты -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #39ff14;
    font-family: "Courier New", monospace;
  }
  /* верхние 70% экрана — карта с радаром */
  #screen { position: absolute; top: 0; left: 0; right: 0; bottom: 30%; }
  #map, #radar { position: absolute; inset: 0; width: 100%; height: 100%; }
  #radar { z-index: 500; pointer-events: none; }   /* радар рисуется поверх карты */
  .leaflet-container { background: #000; }
  /* в режиме радара: светлую карту делаем тёмной (invert) и перекрашиваем в зелёный */
  #map.radar-style .leaflet-tile-pane {
    filter: invert(1) grayscale(1) sepia(1) hue-rotate(50deg) saturate(3) brightness(0.7);
  }

  /* круглые кнопки слева внизу карты */
  #buttons {
    position: absolute; left: 10px; bottom: 10px; z-index: 700;
    display: flex; flex-direction: column; gap: 8px;
  }
  #buttons button {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid #39ff14; background: #000c; font-size: 22px;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 600;
    text-align: center;
    padding: calc(env(safe-area-inset-top) + 8px) 8px 16px;
    background: linear-gradient(#000e, #0000);
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 3px; text-shadow: 0 0 8px #39ff14; }
  #status { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  #gps { font-size: 11px; opacity: 0.6; margin-top: 2px; }

  /* нижние 30% — список ближайших точек */
  #list {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
    overflow-y: auto; box-sizing: border-box;
    border-top: 1px solid #39ff1466;
    padding: 4px 12px;
  }
  .shop {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #39ff1422;
    color: #39ff14; text-decoration: none; font-size: 15px;
  }
  .shop.star { color: #ffd400; }

  /* стартовый экран с кнопкой */
  #start {
    position: absolute; inset: 0; z-index: 2000; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 20px;
  }
  #start .logo { font-size: 64px; }
  #start p { max-width: 320px; opacity: 0.8; line-height: 1.4; }
  #start button, .green-btn {
    font: inherit; font-size: 20px; font-weight: bold;
    color: #000; background: #39ff14; border: none; border-radius: 12px;
    padding: 16px 28px; box-shadow: 0 0 20px #39ff14;
  }

  /* ===== Вкладки ===== */
  :root { --bar: calc(60px + env(safe-area-inset-bottom)); }
  /* каждая вкладка занимает экран над панелью вкладок; видна только активная */
  .tab { position: absolute; top: 0; left: 0; right: 0; bottom: var(--bar); display: none; }
  .tab.active { display: block; }
  #tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); z-index: 3000;
    display: flex; background: #000; border-top: 1px solid #39ff1466;
    padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box;
  }
  #tabbar button {
    flex: 1; background: none; border: none; color: #39ff1488;
    font: inherit; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  #tabbar button .ico { font-size: 22px; }
  #tabbar button.active { color: #39ff14; text-shadow: 0 0 6px #39ff14; }

  /* заголовок для вкладок 2 и 3 */
  .page-title {
    text-align: center; padding: calc(env(safe-area-inset-top) + 10px) 8px 6px;
  }
  .scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ===== Вкладка «Ассортимент» ===== */
  #chosen { text-align: center; font-size: 13px; opacity: 0.8; margin-bottom: 8px; }
  #catalog {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 12px 16px;
  }
  .card {
    border: 1px solid #39ff1444; border-radius: 12px; padding: 10px 8px;
    text-align: center; background: #0a1a0a;
  }
  .card.selected { border-color: #ffd400; box-shadow: 0 0 12px #ffd40088; }
  .card .name { font-weight: bold; font-size: 15px; margin-top: 4px; color: #fff; }
  .card .taste { font-size: 12px; opacity: 0.8; margin: 2px 0; }
  .card .desc { font-size: 11px; opacity: 0.6; min-height: 42px; }
  .card .fizz { font-size: 12px; margin: 4px 0; }
  .card button {
    font: inherit; font-size: 12px; margin-top: 4px; padding: 6px 10px;
    border-radius: 8px; border: 1px solid #39ff14; background: none; color: #39ff14;
  }
  .card.selected .pick { background: #ffd400; border-color: #ffd400; color: #000; }

  /* ===== Вкладка «Кликер» ===== */
  #clicker { text-align: center; padding-bottom: 20px; }
  #bubblesCount { font-size: 34px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #39ff14; }
  #rates { font-size: 13px; opacity: 0.8; }
  #rank { font-size: 14px; color: #ffd400; margin-top: 4px; }
  #bigBottle {
    position: relative; display: inline-block; margin: 14px 0 6px;
    background: none; border: none; padding: 0;
    -webkit-tap-highlight-color: transparent; transition: transform 0.08s;
  }
  #bigBottle:active { transform: scale(0.92) rotate(-4deg); }
  #bottleName { font-size: 13px; opacity: 0.7; }
  /* всплывающее «+1» и пузырики после клика */
  .float {
    position: absolute; pointer-events: none; font-weight: bold; color: #fff;
    text-shadow: 0 0 6px #39ff14; animation: floatUp 0.9s ease-out forwards;
  }
  .bubble {
    position: absolute; pointer-events: none; border-radius: 50%;
    border: 2px solid #aefcff; animation: floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-120px); opacity: 0; }
  }
  #upgrades { max-width: 420px; margin: 14px auto 0; padding: 0 12px; text-align: left; }
  .upgrade {
    display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
    margin-bottom: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid #39ff1466; background: #0a1a0a; color: #39ff14; font: inherit; text-align: left;
  }
  .upgrade:disabled { opacity: 0.4; }
  .upgrade .ico { font-size: 26px; }
  .upgrade .info { flex: 1; }
  .upgrade .title { color: #fff; font-weight: bold; font-size: 14px; }
  .upgrade .sub { font-size: 12px; opacity: 0.8; }
  .upgrade .cost { font-size: 13px; white-space: nowrap; }
</style>
</head>
<body>

<!-- ===== Вкладка 1: Локатор ===== -->
<div class="tab active" id="tab-radar">
  <div id="screen">
    <div id="map"></div>
    <canvas id="radar"></canvas>
    <header>
      <h1>ЛОКАТОР ГАЗЯВЫ</h1>
      <div id="status">Запуск...</div>
      <div id="gps"></div>
    </header>
    <div id="buttons">
      <button id="mapBtn" title="Вид карты">🗺️</button>
      <button id="soundBtn" title="Звук">🔊</button>
    </div>
  </div>
  <div id="list"></div>

  <div id="start">
    <div class="logo">🥤📡</div>
    <h1>ЛОКАТОР ГАЗЯВЫ</h1>
    <p>Сканирует местность и находит, где водится газява.<br><br>
       Разреши доступ к геопозиции и включи звук (переключатель сбоку не на беззвучном).</p>
    <button id="startBtn">ВКЛЮЧИТЬ ЛОКАТОР</button>
  </div>
</div>

<!-- ===== Вкладка 2: Ассортимент ===== -->
<div class="tab" id="tab-shop">
  <div class="scroll">
    <div class="page-title"><h1>АССОРТИМЕНТ</h1></div>
    <div id="chosen"></div>
    <div id="catalog"></div>
  </div>
</div>

<!-- ===== Вкладка 3: Кликер ===== -->
<div class="tab" id="tab-clicker">
  <div class="scroll">
    <div class="page-title"><h1>КЛИКЕР ГАЗЯВЫ</h1></div>
    <div id="clicker">
      <div id="bubblesCount">0</div>
      <div id="rates"></div>
      <div id="rank"></div>
      <button id="bigBottle"></button>
      <div id="bottleName"></div>
      <div id="upgrades"></div>
    </div>
  </div>
</div>

<!-- ===== Панель вкладок внизу ===== -->
<div id="tabbar">
  <button data-tab="tab-radar" class="active"><span class="ico">📡</span>Локатор</button>
  <button data-tab="tab-shop"><span class="ico">🥤</span>Ассортимент</button>
  <button data-tab="tab-clicker"><span class="ico">👆</span>Кликер</button>
</div>

<script>
// ===== Настройки =====
const SEARCH_RADIUS = 1500;   // в каком радиусе ищем магазины, метров
const REFRESH_DISTANCE = 300; // если отошли дальше — ищем магазины заново, метров
const SWEEP_TIME = 4000;      // один оборот луча радара, мс
const GREEN = "57,255,20";    // цвет радара (r,g,b)
const GOLD = "255,212,0";     // цвет для «Магнита»

let map, canvas, ctx;
let me = null;           // где сейчас телефон: {lat, lon, heading}
let lastLoadPos = null;  // где последний раз искали магазины
let shops = [];          // найденные магазины: {name, lat, lon, dist, star, hit}
let loading = false;
let prevAngle = 0;       // угол луча на прошлом кадре

// карта: два вида — обычный (улицы хорошо видно) и зелёный «радарный»
let radarStyle = false;
let trail, accuracyCircle;   // след пройденного пути и круг точности GPS

// звук
let audio = null, echo = null;
let soundOn = true;
let lastBubbles = 0;     // когда последний раз булькали (чтобы не было каши из звуков)
let pingedThisTurn = false;

document.getElementById("startBtn").onclick = start;
document.getElementById("mapBtn").onclick = toggleMapStyle;
document.getElementById("soundBtn").onclick = toggleSound;

function start() {
  ensureAudio();
  document.getElementById("start").style.display = "none";

  // Карта: двигать пальцем нельзя (центр всегда — мы), приближать можно
  map = L.map("map", {
    zoomControl: false, dragging: false,
    touchZoom: "center", scrollWheelZoom: "center", doubleClickZoom: "center",
  }).setView([53.195, 50.1], 16);   // пока нет координат — центр Самары
  // карта OpenStreetMap — бесплатно и без ключа (радарный вид делается CSS-фильтром)
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap", maxZoom: 19,
  }).addTo(map);

  // след пути и круг точности
  trail = L.polyline([], { color: "#39ff14", weight: 4, opacity: 0.8 }).addTo(map);
  accuracyCircle = L.circle([0, 0], { radius: 0, color: "#39ff14", weight: 1, fillOpacity: 0.08 }).addTo(map);

  canvas = document.getElementById("radar");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", resize);

  if (!navigator.geolocation) {
    setStatus("Телефон не умеет определять местоположение 😢");
  } else {
    setStatus("Ищу спутники...");
    // watchPosition вызывает onPosition каждый раз, когда телефон сдвинулся
    navigator.geolocation.watchPosition(onPosition, onGeoError,
      { enableHighAccuracy: true, maximumAge: 5000 });
  }
  requestAnimationFrame(draw);
}

// ===== Геопозиция =====

function onPosition(pos) {
  const c = pos.coords;
  const old = me;
  me = { lat: c.latitude, lon: c.longitude, heading: old ? old.heading : null };
  // направление движения телефон сообщает, только когда мы идём
  if (c.heading !== null && !isNaN(c.heading) && c.speed > 0.5) me.heading = c.heading;

  map.setView([me.lat, me.lon], map.getZoom(), { animate: false });

  // добавляем точку в след, если сдвинулись хотя бы на 3 метра
  if (!old || distance(old, me) > 3) trail.addLatLng([me.lat, me.lon]);
  accuracyCircle.setLatLng([me.lat, me.lon]).setRadius(c.accuracy);
  document.getElementById("gps").textContent =
    `📍 ${me.lat.toFixed(5)}, ${me.lon.toFixed(5)}  точность ±${Math.round(c.accuracy)} м`;

  for (const s of shops) s.dist = distance(me, s);
  updateList();
  // первый раз или ушли далеко — ищем магазины заново
  if (!lastLoadPos || distance(me, lastLoadPos) > REFRESH_DISTANCE) loadShops();
}

function onGeoError(err) {
  if (err.code === 1) setStatus("Нет доступа к геопозиции. Разреши его в настройках Safari");
  else setStatus("Не могу поймать сигнал, пробую ещё...");
}

// ===== Поиск магазинов через Nominatim (OpenStreetMap, бесплатно, без ключа) =====

async function loadShops() {
  if (loading) return;
  loading = true;
  lastLoadPos = { ...me };
  setStatus("Сканирую местность...");

  // квадрат вокруг нас: сколько градусов в SEARCH_RADIUS метрах
  const dLat = SEARCH_RADIUS / 111320;
  const dLon = SEARCH_RADIUS / (111320 * Math.cos(me.lat * Math.PI / 180));
  const viewbox = [me.lon - dLon, me.lat + dLat, me.lon + dLon, me.lat - dLat].join(",");
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=50&bounded=1"
            + "&accept-language=ru&q=supermarket&viewbox=" + viewbox;
  try {
    const resp = await fetch(url);
    const data = await resp.json();
    shops = data.map(el => {
      const name = el.name || "Магазинчик";
      return {
        name: name,
        lat: Number(el.lat),            // координаты приходят строками
        lon: Number(el.lon),
        star: /магнит/i.test(name),     // «Магнит» подсвечиваем золотым
        hit: 0,                         // когда луч последний раз прошёл над магазином
      };
    });
    for (const s of shops) s.dist = distance(me, s);
    // квадрат шире круга — отбрасываем то, что дальше радиуса
    shops = shops.filter(s => s.dist <= SEARCH_RADIUS);
    updateList();
    setStatus(shops.length
      ? `«${SODAS[chosen].name}» обнаружен(а): ${shops.length} точек в радиусе ${SEARCH_RADIUS / 1000} км`
      : "Газявы поблизости нет... 😱");
  } catch (e) {
    setStatus("Радар барахлит (нет связи). Повторю через 15 секунд");
    setTimeout(() => { lastLoadPos = null; }, 15000);
  }
  loading = false;
}

// ===== Список ближайших точек =====

function updateList() {
  shops.sort((a, b) => a.dist - b.dist);
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const s of shops.slice(0, 10)) {
    const row = document.createElement("a");
    row.className = s.star ? "shop star" : "shop";
    // по нажатию — пеший маршрут в Яндекс Картах
    row.href = `https://yandex.ru/maps/?rtext=~${s.lat},${s.lon}&rtt=pd`;
    row.target = "_blank";
    const name = document.createElement("span");
    name.textContent = (s.star ? "⭐ " : "🥤 ") + s.name;
    const dist = document.createElement("span");
    dist.textContent = formatDist(s.dist);
    row.append(name, dist);
    list.appendChild(row);
  }
}

// ===== Рисование радара (60 раз в секунду) =====

function draw(time) {
  requestAnimationFrame(draw);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // центр радара — наша точка на карте (или центр экрана, пока координат нет)
  const c = me ? map.latLngToContainerPoint([me.lat, me.lon]) : { x: w / 2, y: h / 2 };
  const R = Math.min(w, h) / 2 * 0.9;                             // радиус радара в пикселях
  const angle = (time % SWEEP_TIME) / SWEEP_TIME * Math.PI * 2;   // куда смотрит луч

  // кольца и перекрестие
  ctx.strokeStyle = `rgba(${GREEN},0.35)`;
  ctx.lineWidth = 1;
  ctx.fillStyle = `rgba(${GREEN},0.7)`;
  ctx.font = "11px Courier New";
  const radiusMeters = map.distance(map.containerPointToLatLng([c.x, c.y]),
                                    map.containerPointToLatLng([c.x + R, c.y]));
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, R * i / 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillText(formatDist(radiusMeters * i / 3), c.x + 4, c.y - R * i / 3 + 12);
  }
  ctx.beginPath();
  ctx.moveTo(c.x - R, c.y); ctx.lineTo(c.x + R, c.y);
  ctx.moveTo(c.x, c.y - R); ctx.lineTo(c.x, c.y + R);
  ctx.stroke();

  // «хвост» за лучом: несколько секторов, каждый прозрачнее предыдущего
  const TRAIL = 0.7, STEPS = 20;
  for (let i = 0; i < STEPS; i++) {
    ctx.fillStyle = `rgba(${GREEN},${0.25 * (1 - i / STEPS)})`;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.arc(c.x, c.y, R, angle - TRAIL * (i + 1) / STEPS, angle - TRAIL * i / STEPS);
    ctx.closePath();
    ctx.fill();
  }
  // сам луч
  ctx.strokeStyle = `rgba(${GREEN},1)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y);
  ctx.lineTo(c.x + R * Math.cos(angle), c.y + R * Math.sin(angle));
  ctx.stroke();

  // новый оборот луча — снова можно сыграть «пинг» подлодки
  if (angle < prevAngle) pingedThisTurn = false;

  // магазины: вспыхивают, когда луч проходит над ними, и потом гаснут
  let beep = false;
  for (const s of shops) {
    const p = map.latLngToContainerPoint([s.lat, s.lon]);
    const dx = p.x - c.x, dy = p.y - c.y;
    if (Math.hypot(dx, dy) > R) continue;           // за краем радара — не видно
    let a = Math.atan2(dy, dx);
    if (a < 0) a += Math.PI * 2;
    if (beamPassed(prevAngle, angle, a)) { s.hit = time; beep = true; }

    const age = (time - s.hit) / SWEEP_TIME;         // 0 — только что, 1 — оборот назад
    if (s.hit && age < 1) {
      const alpha = 1 - age;
      const color = s.star ? GOLD : GREEN;
      ctx.fillStyle = `rgba(${color},${alpha})`;
      ctx.shadowColor = `rgb(${color})`;
      ctx.shadowBlur = 15 * alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, s.star ? 8 : 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = "12px Courier New";
      ctx.fillText(s.name, p.x + 10, p.y + 4);
    }
  }
  if (beep) onGazyavaFound(time);
  prevAngle = angle;

  // мы — пульсирующая точка в центре
  if (me) {
    const pulse = 5 + 3 * Math.sin(time / 200);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // стрелка — куда идём (heading: 0 = север, по часовой)
    if (me.heading !== null) {
      const h = (me.heading - 90) * Math.PI / 180;   // переводим в угол холста (0 = восток)
      ctx.fillStyle = "#39ff14";
      ctx.beginPath();
      ctx.moveTo(c.x + 22 * Math.cos(h), c.y + 22 * Math.sin(h));        // кончик
      ctx.lineTo(c.x + 10 * Math.cos(h + 2.5), c.y + 10 * Math.sin(h + 2.5));
      ctx.lineTo(c.x + 10 * Math.cos(h - 2.5), c.y + 10 * Math.sin(h - 2.5));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
}

// прошёл ли луч над углом a между прошлым и текущим кадром
function beamPassed(prev, cur, a) {
  if (prev <= cur) return a > prev && a <= cur;
  return a > prev || a <= cur;   // луч перешёл через 0 (новый оборот)
}

// ===== Звуки подводной лодки (синтезируются кодом, без файлов) =====

// Луч прошёл над газявой: «пинг» гидролокатора (раз за оборот) + бульканье
function onGazyavaFound(time) {
  if (!soundOn || !audio) return;
  if (!pingedThisTurn) {
    playSonarPing();
    pingedThisTurn = true;
  }
  if (time - lastBubbles > 400) {
    playBubbles();
    lastBubbles = time;
  }
}

// Эхо: звук повторяется всё тише, как под водой.
// Создаём один раз: вход echo -> динамики и echo -> задержка -> (петля) -> динамики
function setupEcho() {
  echo = audio.createGain();
  const delay = audio.createDelay();
  delay.delayTime.value = 0.35;       // эхо через 0.35 с
  const feedback = audio.createGain();
  feedback.gain.value = 0.4;          // каждое следующее эхо на 60% тише
  echo.connect(audio.destination);
  echo.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(audio.destination);
}

// «Пиннннг» сонара: чистый тон, резкое начало, долгое затухание
function playSonarPing() {
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(1200, t);
  osc.frequency.exponentialRampToValueAtTime(1100, t + 1.5);   // тон чуть «плывёт» вниз
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  osc.connect(gain);
  gain.connect(echo);
  osc.start(t);
  osc.stop(t + 1.9);
}

// Бульканье: несколько коротких «блупов» в случайные моменты
function playBubbles() {
  const t0 = audio.currentTime;
  const count = 5 + Math.floor(Math.random() * 6);   // 5–10 пузырьков
  for (let i = 0; i < count; i++) {
    playOneBubble(t0 + Math.random() * 0.7);
  }
}

// Один пузырёк «блуп»: тон быстро идёт вверх
function playOneBubble(t) {
  const f = 250 + Math.random() * 450;   // у каждого пузырька своя высота
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 2.5, t + 0.07);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(t);
  osc.stop(t + 0.1);
}

// Звук создаём один раз и только после нажатия (иначе айфон не даст играть)
function ensureAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    setupEcho();
  }
  if (audio.state === "suspended") audio.resume();
}

function resize() {

// расстояние между двумя точками на Земле в метрах (формула гаверсинусов)
function distance(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function formatDist(m) {
  return m < 1000 ? `${Math.round(m)} м` : `${(m / 1000).toFixed(1)} км`;
}

// сохранение в памяти телефона (localStorage). try — на случай, если браузер запретил
function loadData(key, byDefault) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? byDefault : JSON.parse(value);
  } catch (e) {
    return byDefault;
  }
}
function saveData(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// число с пробелами: 12345 -> «12 345»
function fmt(n) {
  return Math.floor(n).toLocaleString("ru-RU");
}

}

// ===== Вкладка 3: Кликер =====
// click — сколько добавляет к силе клика, auto — сколько пузыриков в секунду сам

const UPGRADES = [
  { id: "shake",   ico: "🤲", title: "Встряхнуть сильнее", sub: "+1 за клик",       cost: 15,    click: 1, auto: 0 },
  { id: "ice",     ico: "🧊", title: "Лёд в стакан",       sub: "+1 в секунду",     cost: 50,    click: 0, auto: 1 },
  { id: "straw",   ico: "🥤", title: "Трубочка",           sub: "+5 за клик",       cost: 250,   click: 5, auto: 0 },
  { id: "kiosk",   ico: "🏪", title: "Ларёк с газявой",    sub: "+5 в секунду",     cost: 500,   click: 0, auto: 5 },
  { id: "factory", ico: "🏭", title: "Завод газявы",       sub: "+30 в секунду",    cost: 4000,  click: 0, auto: 30 },
  { id: "rocket",  ico: "🚀", title: "Газява в космосе",   sub: "+200 в секунду",   cost: 40000, click: 0, auto: 200 },
];

// звания по количеству всех собранных пузыриков
const RANKS = [
  [0, "Новичок газявы"], [100, "Любитель пузыриков"], [1000, "Газировщик"],
  [10000, "Сомелье газявы"], [100000, "Газявный магнат"], [1000000, "Властелин газявы 👑"],
];

// состояние игры: сколько пузыриков сейчас, сколько всего, сколько куплено улучшений
let game = loadData("gazyava_clicker", { bubbles: 0, total: 0, owned: {} });

// каждое следующее улучшение дороже на 15%
function upgradeCost(u) {
  return Math.floor(u.cost * Math.pow(1.15, game.owned[u.id] || 0));
}
function clickPower() {
  let power = 1;
  for (const u of UPGRADES) power += u.click * (game.owned[u.id] || 0);
  return power;
}
function autoPerSecond() {
  let sum = 0;
  for (const u of UPGRADES) sum += u.auto * (game.owned[u.id] || 0);
  return sum;
}
function addBubbles(n) {
  game.bubbles += n;
  game.total += n;
}

function renderClickerBottle() {
  document.getElementById("bigBottle").innerHTML = bottleSVG(SODAS[chosen], 220);
  document.getElementById("bottleName").textContent = `Жми на «${SODAS[chosen].name}»!`;
}

// кнопки улучшений создаём один раз, потом только обновляем цифры
function renderUpgrades() {
  const box = document.getElementById("upgrades");
  for (const u of UPGRADES) {
    const btn = document.createElement("button");
    btn.className = "upgrade";
    btn.id = "up-" + u.id;
    btn.innerHTML = `<span class="ico">${u.ico}</span>
      <span class="info"><div class="title">${u.title}</div><div class="sub"></div></span>
      <span class="cost"></span>`;
    btn.onclick = () => buyUpgrade(u);
    box.appendChild(btn);
  }
}

function buyUpgrade(u) {
  const cost = upgradeCost(u);
  if (game.bubbles < cost) return;
  game.bubbles -= cost;
  game.owned[u.id] = (game.owned[u.id] || 0) + 1;
  saveData("gazyava_clicker", game);
  if (soundOn) { ensureAudio(); playBubbles(); }
  updateClicker();
}

function updateClicker() {
  document.getElementById("bubblesCount").textContent = fmt(game.bubbles) + " 🫧";
  document.getElementById("rates").textContent =
    `+${fmt(clickPower())} за клик · +${fmt(autoPerSecond())} в секунду`;
  let rank = RANKS[0][1];
  for (const [need, name] of RANKS) if (game.total >= need) rank = name;
  document.getElementById("rank").textContent = "🏅 " + rank;

  for (const u of UPGRADES) {
    const btn = document.getElementById("up-" + u.id);
    const count = game.owned[u.id] || 0;
    const cost = upgradeCost(u);
    btn.querySelector(".sub").textContent = u.sub + (count ? `  (есть: ${count})` : "");
    btn.querySelector(".cost").textContent = fmt(cost) + " 🫧";
    btn.disabled = game.bubbles < cost;
  }
}

// клик по бутылке
document.getElementById("bigBottle").onclick = (e) => {
  const power = clickPower();
  addBubbles(power);
  spawnFloat(e, "+" + fmt(power));
  if (soundOn) { ensureAudio(); playOneBubble(audio.currentTime); }
  updateClicker();
};

// всплывающее «+N» и пузырики в месте нажатия
function spawnFloat(e, text) {
  const btn = document.getElementById("bigBottle");
  const rect = btn.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
  const items = [];

  const label = document.createElement("div");
  label.className = "float";
  label.textContent = text;
  label.style.left = x + "px";
  label.style.top = y + "px";
  items.push(label);

  for (let i = 0; i < 3; i++) {
    const b = document.createElement("div");
    const size = 6 + Math.random() * 10;
    b.className = "bubble";
    b.style.width = b.style.height = size + "px";
    b.style.left = (x + (Math.random() - 0.5) * 60) + "px";
    b.style.top = (y + (Math.random() - 0.5) * 20) + "px";
    items.push(b);
  }
  for (const el of items) {
    btn.appendChild(el);
    setTimeout(() => el.remove(), 1200);   // убираем после анимации
  }
}

// автоматические пузырики: 10 раз в секунду по 1/10 от «в секунду»
setInterval(() => {
  const perSecond = autoPerSecond();
  if (perSecond > 0) {
    addBubbles(perSecond / 10);
    updateClicker();
  }
}, 100);

// сохраняем игру каждые 2 секунды и когда приложение сворачивают
setInterval(() => saveData("gazyava_clicker", game), 2000);
document.addEventListener("visibilitychange", () => saveData("gazyava_clicker", game));

// ===== Запуск вкладок 2 и 3 =====
renderCatalog();
renderUpgrades();
renderClickerBottle();
updateClicker();
</script>
